<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감성 일기 생성기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 사이드바 -->
            <div class="col-md-3 sidebar">
                <div class="sidebar-header">
                    <h3><i class="fas fa-book-open"></i> 감성 일기 생성기</h3>
                    <p class="text-muted">카카오톡 대화로 일기를 만들어보세요</p>
                </div>
                
                <div class="upload-section">
                    <h5><i class="fas fa-upload"></i> 파일 업로드</h5>
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="file" class="form-label">카카오톡 대화 파일 (.txt)</label>
                            <input type="file" class="form-control" id="file" name="file" accept=".txt" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="searchLog" class="form-label">검색 기록 (선택사항)</label>
                            <textarea class="form-control" id="searchLog" name="search_log" rows="3" placeholder="오늘 검색한 내용이나 특별한 활동이 있다면 적어주세요..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="userPrompt" class="form-label">사용자 정의 프롬프트 (선택사항)</label>
                            <textarea class="form-control" id="userPrompt" name="user_prompt" rows="3" placeholder="특별한 스타일이나 요구사항이 있다면 적어주세요..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="usePrompt" name="use_prompt" checked>
                                <label class="form-check-label" for="usePrompt">
                                    프롬프트 사용
                                </label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="useDateAnalysis" name="use_date_analysis">
                                <label class="form-check-label" for="useDateAnalysis">
                                    날짜별 분석 사용
                                </label>
                            </div>
                        </div>
                        
                        <div class="mb-3" id="dateInputSection" style="display: none;">
                            <label for="targetDate" class="form-label">특정 날짜 (예: 6월 14일)</label>
                            <input type="text" class="form-control" id="targetDate" name="target_date" placeholder="6월 14일">
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100" id="generateBtn">
                            <i class="fas fa-magic"></i> 일기 생성하기
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- 메인 콘텐츠 -->
            <div class="col-md-9 main-content">
                <div class="content-header">
                    <h2>감성 일기 생성기</h2>
                    <p>카카오톡 대화를 업로드하고 AI가 분석한 감성 일기를 받아보세요</p>
                </div>
                
                <div id="loadingSection" class="text-center" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">일기를 생성하고 있습니다...</p>
                </div>
                
                <div id="resultSection" style="display: none;">
                    <div class="diary-card">
                        <div class="diary-header">
                            <h4><i class="fas fa-calendar-day"></i> <span id="diaryDate"></span></h4>
                            <div class="emotion-chart" id="emotionChart"></div>
                        </div>
                        
                        <div class="diary-content">
                            <div class="diary-text" id="diaryText"></div>
                        </div>
                        
                        <div class="diary-footer">
                            <button class="btn btn-outline-primary" onclick="downloadDiary()">
                                <i class="fas fa-download"></i> 일기 다운로드
                            </button>
                            <button class="btn btn-outline-secondary" onclick="shareDiary()">
                                <i class="fas fa-share"></i> 공유하기
                            </button>
                        </div>
                    </div>
                </div>
                
                <div id="welcomeSection">
                    <div class="welcome-card">
                        <div class="text-center">
                            <i class="fas fa-book-open fa-3x text-primary mb-4"></i>
                            <h3>감성 일기 생성기에 오신 것을 환영합니다!</h3>
                            <p class="lead">카카오톡 대화 파일을 업로드하고 AI가 분석한 감성 일기를 받아보세요.</p>
                            
                            <div class="features">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="feature-item">
                                            <i class="fas fa-upload fa-2x text-primary"></i>
                                            <h5>파일 업로드</h5>
                                            <p>카카오톡 대화 파일을 업로드하세요</p>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="feature-item">
                                            <i class="fas fa-magic fa-2x text-primary"></i>
                                            <h5>AI 분석</h5>
                                            <p>AI가 대화를 분석하여 일기를 생성합니다</p>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="feature-item">
                                            <i class="fas fa-chart-pie fa-2x text-primary"></i>
                                            <h5>감정 분석</h5>
                                            <p>감정 상태를 시각화하여 보여줍니다</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
